name: Link check

# Monthly check of every external link in the site's source. A failed run
# (GitHub emails the repo owner) means a link students rely on has died.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-concurrency 4
            --timeout 30
            --max-retries 2
            --accept 200,204,206,301,302,307,308,403,429,999
            --exclude-mail
            --exclude "^https?://(localhost|127\.0\.0\.1)"
            --exclude "googletagmanager\.com|google-analytics\.com|clarity\.ms"
            "./src/**/*.ts" "./src/**/*.tsx" "./public/**/*.html"
