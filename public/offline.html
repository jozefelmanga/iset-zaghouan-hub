<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B1F3A">
  <title>ما فماش كونيكسيون — ISET Zaghouan Hub</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #F7F9FC;
      color: #10213A;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid #E8EDF4;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(11, 31, 58, 0.06);
    }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 10px; }
    p { font-size: 15px; line-height: 1.8; color: #5F708A; margin: 0 0 12px; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    button, a {
      display: block;
      padding: 12px 16px;
      border-radius: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button { border: none; background: #0B1F3A; color: #FFFFFF; }
    a { border: 1px solid #E8EDF4; color: #077A86; background: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) body { background: #0B1422; color: #E8EEF6; }
      :root:not([data-theme="light"]) main { background: #121E31; border-color: #24344B; box-shadow: none; }
      :root:not([data-theme="light"]) p { color: #B4C0D0; }
      :root:not([data-theme="light"]) button { background: #1B3253; }
      :root:not([data-theme="light"]) a { border-color: #24344B; color: #3FD0DE; background: #121E31; }
    }
    :root[data-theme="dark"] body { background: #0B1422; color: #E8EEF6; }
    :root[data-theme="dark"] main { background: #121E31; border-color: #24344B; box-shadow: none; }
    :root[data-theme="dark"] p { color: #B4C0D0; }
    :root[data-theme="dark"] button { background: #1B3253; }
    :root[data-theme="dark"] a { border-color: #24344B; color: #3FD0DE; background: #121E31; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
  </style>
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="ISET Zaghouan Hub">
    <h1>ما فماش كونيكسيون 📵</h1>
    <p>الصفحة هاذي ما تحلّتش قبل على التليفون متاعك، هذاكا علاش ما تنجمش تشوفها من غير إنترنت.</p>
    <p>الصفحات اللي حلّيتها قبل (كيف توقيت الكيران و أوراق البورص) تخدم عادي من غير كونيكسيون.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">عاود جرّب</button>
      <a href="/">ارجع للصفحة الرئيسية</a>
    </div>
  </main>
</body>
</html>
